[project]
name = "sight-ml"
version = "0.1.0"
description = "Sight ML pipeline. Generates synthetic NovaPay history, trains Prophet models, exports JSON for the Next.js frontend."
requires-python = ">=3.10,<3.14"
dependencies = [
    "prophet>=1.1.5",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "pyarrow>=15.0",
    "holidays>=0.50",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.46",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "chronos-forecasting>=1.4",
]

[dependency-groups]
dev = []
